<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Мій склад</title>
<meta name="description" content="Приймання й відвантаження посилок">
<meta name="theme-color" content="#0d131a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Мій склад">
<meta name="format-detection" content="telephone=no">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<style>
/* Layout: одна колонка, липка шапка, нижня панель з 3 вкладок: Склад · Прийом · Історія. */
:root {
  --bg: #0d131a;
  --surface: #141c25;
  --surface-2: #1b2530;
  --line: #243140;
  --line-2: #31414f;
  --fg: #e6ecf2;
  --muted: #8f9cab;
  --faint: #5f6d7c;
  --accent: #3cc4b6;
  --accent-ink: #05211d;
  --danger: #f2786d;
  --warn: #f0b44a;
  --in: #6fcf97;
  --out: #6aa8f7;
  --font-ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-display: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, "Roboto Mono", monospace;
  --r: 16px;
  --tab-h: 60px;
  --sat: env(safe-area-inset-top, 0px);
  --sab: env(safe-area-inset-bottom, 0px);
  --gutter-l: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
  color-scheme: dark;
}
:root.theme-light {
  --bg: #f2f4f6;
  --surface: #ffffff;
  --surface-2: #e9edf1;
  --line: #dbe1e7;
  --line-2: #c4ced8;
  --fg: #142029;
  --muted: #586675;
  --faint: #8995a2;
  --accent: #0b8b80;
  --accent-ink: #ffffff;
  --danger: #c7463a;
  --warn: #a86e05;
  --in: #23874d;
  --out: #2c66c4;
  color-scheme: light;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; background: var(--bg); }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font: 16px/1.4 var(--font-ui);
  -webkit-tap-highlight-color: transparent;
  overflow-x: hidden;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: var(--sat); z-index: 30; background: var(--bg); }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; text-align: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.ic svg, svg.ic { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.ic { display: inline-flex; }
[hidden] { display: none !important; }

/* ---------- шапка ---------- */
.topbar {
  position: sticky; top: var(--sat); z-index: 20;
  display: flex; align-items: center; gap: 6px;
  min-height: 54px; padding-block: 6px;
  padding-left: var(--gutter-l); padding-right: var(--gutter-r);
  background: var(--bg);
  border-bottom: 1px solid transparent;
}
.topbar > .icon-btn:last-child { margin-right: -11px; }
.topbar.scrolled { border-bottom-color: var(--line); }
.topbar h1 {
  flex: 1; min-width: 0; margin: 0;
  font: 700 22px/1.15 var(--font-display); letter-spacing: -0.01em;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.topbar .back { margin-left: -8px; }
.icon-btn {
  position: relative; width: 44px; height: 44px; border-radius: 12px;
  display: inline-flex; align-items: center; justify-content: center; color: var(--fg);
}
.icon-btn:active { background: var(--surface-2); }

/* ---------- основна область ---------- */
main {
  padding-left: var(--gutter-l); padding-right: var(--gutter-r);
  padding-block: 4px calc(var(--tab-h) + var(--sab) + 28px);
  max-width: 760px; margin: 0 auto;
  display: flex; flex-direction: column; gap: 14px;
}
main.has-bar { padding-bottom: calc(var(--tab-h) + var(--sab) + 104px); }

/* ---------- нижня панель ---------- */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 25;
  display: grid; grid-template-columns: repeat(3, 1fr);
  padding-left: var(--gutter-l); padding-right: var(--gutter-r);
  padding-bottom: var(--sab);
  background: var(--surface); border-top: 1px solid var(--line);
}
.tab {
  height: var(--tab-h); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  color: var(--muted); font-size: 11px; font-weight: 600; letter-spacing: 0.01em; position: relative;
}
.tab.on { color: var(--accent); }
.tab .badge {
  position: absolute; top: 6px; left: calc(50% + 6px); min-width: 18px; height: 18px; padding: 0 5px;
  border-radius: 9px; background: var(--accent); color: var(--accent-ink);
  font: 700 11px/18px var(--font-ui); text-align: center;
}

/* ---------- базові елементи ---------- */
.btn {
  min-height: 46px; padding: 0 16px; border-radius: 13px;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  background: var(--surface-2); color: var(--fg); font-weight: 600; font-size: 15px;
  border: 1px solid var(--line);
  white-space: nowrap;
}
.btn:active { filter: brightness(1.15); }
.btn .ic svg { width: 19px; height: 19px; }
.btn-primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.btn-danger { background: transparent; color: var(--danger); border-color: color-mix(in srgb, var(--danger) 40%, transparent); }
.btn-ghost { background: transparent; border-color: transparent; color: var(--accent); }
.btn-sm { min-height: 38px; padding: 0 12px; font-size: 14px; border-radius: 11px; }
.btn-block { width: 100%; }
.btn[disabled] { opacity: .45; pointer-events: none; }
.row-btns { display: flex; gap: 8px; flex-wrap: wrap; }
.row-btns > .btn { flex: 1 1 0; min-width: 0; }

.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > span, .label {
  font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: 0.05em; text-transform: uppercase;
}
.input, .textarea, .select {
  width: 100%; min-height: 46px; padding: 11px 13px; border-radius: 12px;
  background: var(--surface); border: 1px solid var(--line-2); color: var(--fg);
  font-size: 16px; outline: none; -webkit-appearance: none; appearance: none;
}
.input:focus, .textarea:focus, .select:focus { border-color: var(--accent); }
.textarea { min-height: 150px; resize: vertical; font-family: var(--font-mono); font-size: 15px; line-height: 1.45; }
.select {
  background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
  background-position: calc(100% - 18px) 50%, calc(100% - 13px) 50%; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 34px;
}
input[type="date"].input { min-height: 46px; display: block; padding-left: 10px; padding-right: 6px; font-variant-numeric: tabular-nums; }
input[type="date"].input::-webkit-date-and-time-value { text-align: left; }
input[type="date"].input::-webkit-calendar-picker-indicator { margin-left: 0; padding: 0; opacity: .6; }
.grid-2e { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }

.search { position: relative; }
.search .ic { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--faint); pointer-events: none; }
.search .ic svg { width: 19px; height: 19px; }
.search .input { padding-left: 40px; }

.seg {
  display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 3px; padding: 3px;
  background: var(--surface-2); border-radius: 13px;
}
.seg button { min-height: 38px; border-radius: 10px; font-size: 14px; font-weight: 600; color: var(--muted); text-align: center; padding: 0 6px; }
.seg button.on { background: var(--surface); color: var(--fg); box-shadow: 0 1px 2px rgba(0,0,0,.25); }

.pill {
  display: inline-flex; align-items: center; gap: 6px; flex: none;
  padding: 4px 9px; border-radius: 20px; font-size: 12.5px; font-weight: 650; white-space: nowrap;
  color: var(--st, var(--muted));
  background: var(--surface-2);
  background: color-mix(in srgb, var(--st, var(--muted)) 15%, transparent);
}

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; }
.card h3, .sheet h3 { margin: 0 0 6px; font: 700 18px/1.25 var(--font-display); text-wrap: balance; }
.card p, .sheet p { margin: 0 0 10px; color: var(--muted); font-size: 15px; }
.card > :last-child { margin-bottom: 0; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.hint { margin: -6px 0 0; color: var(--muted); font-size: 13px; }
.sec-title { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-top: 4px; }
.sec-title h2 { margin: 0; font: 700 17px/1.3 var(--font-display); }
.empty { text-align: center; color: var(--muted); padding: 28px 12px; font-size: 15px; }
.warn { border-color: color-mix(in srgb, var(--warn) 45%, transparent); }
.warn-text { color: var(--warn); }
.danger-card { border-color: color-mix(in srgb, var(--danger) 50%, transparent); }
.banner { display: flex; align-items: center; gap: 12px; }
.banner > div { flex: 1; min-width: 0; }
.banner p { margin: 2px 0 0; }
.linkrow {
  display: flex; align-items: center; gap: 10px; width: 100%;
  min-height: 52px; padding: 0 14px; border-radius: var(--r); background: var(--surface); border: 1px solid var(--line);
  font-weight: 600;
}
.linkrow span:first-child { flex: 1; }
.linkrow .chev { color: var(--faint); font-size: 22px; line-height: 1; }

/* ---------- склад ---------- */
.totals { display: flex; align-items: baseline; gap: 10px; }
.totals b { font: 700 40px/1 var(--font-display); font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
.totals span { color: var(--muted); font-size: 15px; }
.gsec { display: flex; flex-direction: column; gap: 8px; padding: 12px 12px 14px; border-radius: var(--r); background: var(--surface); border: 1px solid var(--line); }
.gsec-head { display: flex; align-items: center; gap: 8px; }
.gsec-head h3 { flex: 1; min-width: 0; margin: 0; font: 700 19px/1.2 var(--font-display); overflow-wrap: anywhere; }
.gsec-head h3 small { color: var(--muted); font: 500 14px var(--font-ui); margin-left: 6px; }
.dhead {
  display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%;
  min-height: 34px; margin-top: 4px; color: var(--muted); font-size: 13.5px; font-weight: 650;
}
.dhead b { color: var(--fg); font: 700 15px var(--font-display); font-variant-numeric: tabular-nums; }
.dhead .pick { color: var(--accent); font-size: 13px; }
.pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(74px, 1fr)); gap: 7px; }
.pc {
  position: relative; min-height: 58px; padding: 6px 6px 7px; border-radius: 12px; min-width: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; text-align: center;
  background: var(--surface-2); border: 1.5px solid var(--line-2);
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: manipulation;
}
.pc b { font: 700 20px/1.1 var(--font-display); font-variant-numeric: tabular-nums; }
.pc small { display: block; max-width: 100%; font-size: 11.5px; line-height: 1.25; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pc.sel { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.pc.sel small { color: inherit; opacity: .8; }
.pc.prob::after { content: "!"; position: absolute; top: 3px; right: 6px; font: 800 13px var(--font-ui); color: var(--warn); }
.pc.sel.prob::after { color: var(--accent-ink); }
.pc.nonum b { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }

/* нижня панель дій над вкладками */
.action-bar {
  position: fixed; z-index: 24; left: 0; right: 0; bottom: calc(var(--tab-h) + var(--sab));
  padding-block: 10px;
  padding-left: var(--gutter-l); padding-right: var(--gutter-r);
  background: var(--bg); border-top: 1px solid var(--line);
  display: flex; align-items: center; gap: 10px;
}
.action-bar .summary { flex: 1; min-width: 0; font-size: 14px; color: var(--muted); line-height: 1.3; }
.action-bar .summary b { color: var(--fg); font: 700 18px var(--font-display); font-variant-numeric: tabular-nums; }
.action-bar .btn { min-height: 48px; }

/* ---------- прийом ---------- */
.iblock { display: flex; flex-direction: column; padding: 10px 0 2px; border-top: 1px solid var(--line); }
.iblock:first-of-type { border-top: 0; padding-top: 0; }
.iblock h4 { margin: 0 0 4px; font: 700 16px var(--font-display); display: flex; gap: 8px; align-items: baseline; }
.iblock h4 span { color: var(--muted); font: 500 13px var(--font-ui); }
.irow { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 42px; padding: 4px 0; border-top: 1px solid var(--line); font-size: 15px; }
.iblock h4 + .irow { border-top: 0; }
.irow .n { min-width: 34px; flex: none; font: 700 17px var(--font-display); font-variant-numeric: tabular-nums; }
.irow .d { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.irow .flag { flex: none; font-size: 12.5px; font-weight: 650; padding: 4px 9px; border-radius: 20px; color: var(--faint); border: 1px dashed var(--line-2); }
.irow.prob .flag { color: var(--warn); border: 1px solid color-mix(in srgb, var(--warn) 50%, transparent); background: color-mix(in srgb, var(--warn) 14%, transparent); }
.irow.dup { opacity: .5; }
.irow.dup .flag { border: 0; }
.qhead { display: flex; align-items: center; gap: 8px; margin: -4px 0 -2px; }
.qhead-main { flex: 1; min-width: 0; min-height: 40px; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.qhead-main b { font: 700 17px var(--font-display); }
.qedit { color: var(--accent); font-size: 13px; font-weight: 600; margin-left: 4px; }
.qchips { display: flex; flex-wrap: wrap; gap: 8px; }
.qchip {
  min-height: 50px; padding: 0 16px; border-radius: 14px; background: var(--surface); border: 1.5px solid var(--line-2);
  font-weight: 650; font-size: 16px; text-align: center; touch-action: manipulation; -webkit-user-select: none; user-select: none;
}
.qchip.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.qchip.add { border-style: dashed; color: var(--accent); }
.qchip:active { filter: brightness(1.35); }
.qchip.sm { min-height: 42px; padding: 0 13px; font-size: 15px; }
.gsec.open { border-color: var(--accent); }
.d-plus { width: 48px; min-height: 44px; padding: 0; }
.d-plus .ic svg { width: 24px; height: 24px; stroke-width: 2.4; }
.dchips { display: flex; flex-wrap: wrap; gap: 6px; }
.dchip { min-height: 36px; padding: 0 10px; border-radius: 10px; background: var(--surface-2); border: 1.5px solid var(--line-2); font-size: 14px; }
.dchip b { font: 700 15px var(--font-display); font-variant-numeric: tabular-nums; }
.dchip.last { border-color: var(--accent); }
.dchip.prob { border-color: var(--warn); }
.dchip.bad { border-color: var(--danger); color: var(--danger); }
.entry { display: grid; grid-template-columns: 86px minmax(0, 1fr) 46px; gap: 8px; }
.entry .enum { font: 700 22px var(--font-display); text-align: center; padding-inline: 6px; }
.eprob { width: 46px; height: 46px; border: 1px solid var(--line-2); font-size: 18px; }
.eprob.on { color: var(--warn); border-color: var(--warn); background: color-mix(in srgb, var(--warn) 18%, transparent); }
.check-row { display: flex; gap: 12px; align-items: flex-start; font-size: 15px; padding: 4px 0; }
.check-row input { width: 22px; height: 22px; accent-color: var(--accent); margin: 1px 0 0; flex: none; }

/* ---------- текст для начальника ---------- */
.msgtext {
  margin: 0; padding: 14px; border-radius: var(--r); background: var(--surface); border: 1px solid var(--line);
  font: 14.5px/1.5 var(--font-mono); white-space: pre-wrap; overflow-wrap: anywhere; max-height: 460px; overflow: auto;
  -webkit-user-select: text; user-select: text;
}
.thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(72px, 1fr)); gap: 7px; }
.thumbs div { position: relative; aspect-ratio: 1; border-radius: 10px; overflow: hidden; background: var(--surface-2); }
.thumbs img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumbs button { position: absolute; top: 4px; right: 4px; width: 24px; height: 24px; border-radius: 12px; background: rgba(0,0,0,.6); color: #fff; display: flex; align-items: center; justify-content: center; }
.thumbs button svg { width: 14px; height: 14px; stroke-width: 2.6; }

/* ---------- історія ---------- */
.mhead { display: flex; flex-direction: column; gap: 6px; }
.mhead h2 { margin: 0; font: 700 23px/1.2 var(--font-display); overflow-wrap: anywhere; }
.mmeta { color: var(--muted); font-size: 14px; display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; }
.mlist { display: flex; flex-direction: column; gap: 10px; }
.mcard { display: flex; flex-direction: column; gap: 6px; width: 100%; padding: 13px 14px; border-radius: var(--r); background: var(--surface); border: 1px solid var(--line); }
.mcard:active { background: var(--surface-2); }
.mcard-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.mdate { font: 700 15px var(--font-display); color: var(--muted); font-variant-numeric: tabular-nums; }
.mtitle { font: 650 16px/1.35 var(--font-ui); overflow-wrap: anywhere; }
.day-label { margin: 6px 0 -2px; color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; }

/* ---------- аркуші, тост ---------- */
#sheet-root { position: fixed; inset: 0; z-index: 50; }
.sheet-backdrop { position: absolute; inset: 0; background: rgba(4, 8, 12, .6); animation: fade .15s ease-out; }
.sheet {
  position: absolute; left: 0; right: 0; bottom: 0; max-height: calc(100% - var(--sat) - 24px); overflow: auto; overscroll-behavior: contain;
  background: var(--surface); border-radius: 20px 20px 0 0; border-top: 1px solid var(--line-2);
  padding-top: 8px; padding-bottom: calc(18px + var(--sab));
  padding-left: var(--gutter-l); padding-right: var(--gutter-r);
  display: flex; flex-direction: column; gap: 12px;
  animation: up .2s ease-out;
  max-width: 760px; margin: 0 auto;
}
.sheet-grip { width: 38px; height: 5px; border-radius: 3px; background: var(--line-2); margin: 0 auto 4px; flex: none; }
.sheet h3 { margin: 0; }
.sheet .opt-list { display: flex; flex-direction: column; gap: 8px; }
.sheet .kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 15px; margin: 0; }
.sheet .kv dt { color: var(--muted); }
.sheet .kv dd { margin: 0; overflow-wrap: anywhere; }
.list-text { color: var(--muted); font-size: 14px; overflow-wrap: anywhere; }

.toast {
  position: fixed; z-index: 60; left: var(--gutter-l); right: var(--gutter-r);
  bottom: calc(var(--tab-h) + var(--sab) + 12px);
  max-width: 560px; margin: 0 auto;
  display: flex; align-items: center; gap: 12px;
  padding: 12px 14px; border-radius: 14px;
  background: var(--fg); color: var(--bg); font-size: 15px; font-weight: 600;
  box-shadow: 0 8px 24px rgba(0,0,0,.35);
  transform: translateY(20px); opacity: 0; pointer-events: none; transition: transform .2s, opacity .2s;
}
.toast.show { transform: none; opacity: 1; pointer-events: auto; }
.toast.err { background: var(--danger); color: #fff; }
.toast span { flex: 1; min-width: 0; }
.toast button { color: var(--accent); font-weight: 700; padding: 6px 4px; }
:root.theme-light .toast button { color: #7fe3d7; }
.toast.err button { color: #fff; text-decoration: underline; }
body.with-bar .toast { bottom: calc(var(--tab-h) + var(--sab) + 84px); }

@keyframes up { from { transform: translateY(40px); } to { transform: none; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
@media (pointer: coarse) {
  body.kb .tabbar, body.kb .action-bar { display: none; }
  body.kb main { padding-bottom: 40px; }
}
@media (min-width: 560px) { .pgrid { grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); } }

@media (display-mode: standalone) { :root.theme-light body::before { background: #142029; } }

:root { padding-top: env(safe-area-inset-top, 0px); }
</style>
</head>
<body>
<header class="topbar" id="topbar"></header>
<main id="view"><div class="empty">Завантаження…</div></main>
<nav class="tabbar" id="tabbar" aria-label="Розділи"></nav>
<div id="sheet-root" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<noscript><div class="empty">Для роботи «Мого складу» потрібен JavaScript.</div></noscript>
<script>window.__MS_VERSION__ = "2026.11.05-2100";</script>
<script>
/* «Мій склад» — ядро обліку. Чиста логіка без DOM.
   Посилка = позиція (група) + дата пакування + номер, як на ярлику «Манчестер 4.11/1 вода».
   «Манчестер 4.11/1» і «Манчестер 3.11/1» — різні посилки. */
(function (root) {
  'use strict';

  /* ---------- утиліти ---------- */
  let _c = 0;
  function uid(p) {
    _c = (_c + 1) % 1679616;
    return p + Date.now().toString(36) + _c.toString(36) + Math.random().toString(36).slice(2, 6);
  }
  const z2 = n => String(n).padStart(2, '0');
  function todayStr(d) { d = d || new Date(); return d.getFullYear() + '-' + z2(d.getMonth() + 1) + '-' + z2(d.getDate()); }
  /** 2026-11-03 → «3.11» — як у списках для начальника */
  function fmtDay(iso) { if (!iso) return ''; const p = iso.slice(0, 10).split('-'); return (+p[2]) + '.' + p[1]; }
  function fmtDate(iso) { if (!iso) return ''; const p = iso.slice(0, 10).split('-'); return p[2] + '.' + p[1] + '.' + p[0]; }
  function fmtQty(q) { const r = Math.round(q * 1000) / 1000; return Number.isInteger(r) ? String(r) : String(r).replace('.', ','); }
  function norm(t) { return String(t || '').toLowerCase().replace(/ё/g, 'е').replace(/[’'`ʼ]/g, '').replace(/\s+/g, ' ').trim(); }
  function clean(t) { return String(t || '').replace(/\s+/g, ' ').trim(); }
  /** «манчестер» → «Манчестер» для назв позицій */
  function cap(t) { t = clean(t); return t.charAt(0).toUpperCase() + t.slice(1); }
  const collator = (typeof Intl !== 'undefined') ? new Intl.Collator('uk', { numeric: true, sensitivity: 'base' }) : null;
  const cmpStr = (a, b) => collator ? collator.compare(a || '', b || '') : String(a || '').localeCompare(String(b || ''));
  const cmpItem = (a, b) => (a.date || '').localeCompare(b.date || '') || (a.number == null) - (b.number == null) || (a.number || 0) - (b.number || 0);

  /* ---------- стан ---------- */
  function emptyState() {
    return { app: 'miy-sklad', version: 2, groups: [], items: [], events: [], settings: { lastBackupAt: null, theme: 'dark' } };
  }
  function fixItem(it, now) {
    return {
      id: it.id, groupId: it.groupId,
      number: Number.isInteger(it.number) ? it.number : null,
      desc: clean(it.desc), date: String(it.date || todayStr()).slice(0, 10),
      state: it.state === 'departed' ? 'departed' : 'stock',
      problem: !!it.problem, note: clean(it.note),
      arrivalId: it.arrivalId || null, shipmentId: it.shipmentId || null,
      createdAt: it.createdAt || now, updatedAt: it.updatedAt || now
    };
  }
  /** Приводить будь-яку збережену версію (зокрема v1 з місіями) до поточної моделі */
  function migrate(s) {
    const out = emptyState();
    if (!s || typeof s !== 'object') return out;
    const now = new Date().toISOString();
    const st = s.settings || {};
    if (st.theme) out.settings.theme = st.theme;
    if (st.lastBackupAt) out.settings.lastBackupAt = st.lastBackupAt;
    out.groups = (Array.isArray(s.groups) ? s.groups : []).filter(g => g && g.id && clean(g.name)).map(g => ({ id: g.id, name: clean(g.name) }));
    const items = Array.isArray(s.items) ? s.items : [];
    if (s.version === 2) {
      out.items = items.filter(it => it && it.id && it.groupId).map(it => fixItem(it, now));
      out.events = (Array.isArray(s.events) ? s.events : []).filter(e => e && e.id && (e.kind === 'in' || e.kind === 'out'))
        .map(e => ({ id: e.id, kind: e.kind, date: String(e.date || '').slice(0, 10) || todayStr(), ts: e.ts || now, count: e.count || 0, title: clean(e.title) }));
      if (s.legacy) out.legacy = s.legacy;
    } else {
      // v1: товари з кількістю стають позиціями без номера з описом «назва к-сть од.»
      out.items = items.filter(it => it && it.id && it.groupId).map(it => fixItem({
        id: it.id, groupId: it.groupId, number: it.number,
        desc: it.number != null ? (it.name || '') : [it.name, it.qty != null ? fmtQty(it.qty) + (it.unit ? ' ' + it.unit : '') : ''].filter(Boolean).join(' '),
        date: it.date, state: it.state === 'departed' ? 'departed' : 'stock', note: it.notes,
        createdAt: it.createdAt, updatedAt: it.updatedAt
      }, now));
      if ((s.missions && s.missions.length) || (s.movements && s.movements.length))
        out.legacy = { missions: s.missions || [], missionItems: s.missionItems || [], movements: s.movements || [] };
    }
    if (s.savedAt) out.savedAt = s.savedAt;
    return out;
  }

  /* ---------- пошук у стані ---------- */
  function index(s) {
    const groups = new Map(), items = new Map(), events = new Map();
    for (const g of s.groups) groups.set(g.id, g);
    for (const i of s.items) items.set(i.id, i);
    for (const e of s.events) events.set(e.id, e);
    return { s, groups, items, events };
  }
  function findGroup(s, name) { const n = norm(name); return s.groups.find(g => norm(g.name) === n) || null; }
  function ensureGroup(s, name) {
    let g = findGroup(s, name);
    if (!g) { g = { id: uid('g'), name: cap(name) }; s.groups.push(g); }
    return g;
  }
  function findParcel(s, groupId, date, number, exceptId) {
    return s.items.find(i => i.id !== exceptId && i.groupId === groupId && i.date === date && i.number === number && number != null) || null;
  }
  /** Групи в порядку, в якому вони вперше приїхали (як у списках начальника) */
  function groupOrder(s, ids) { const pos = new Map(s.groups.map((g, k) => [g.id, k])); return ids.slice().sort((a, b) => (pos.get(a) ?? 1e9) - (pos.get(b) ?? 1e9)); }
  function groupName(ix, id) { const g = ix.groups.get(id); return g ? g.name : '?'; }
  function itemLabel(ix, it) { return groupName(ix, it.groupId) + ' ' + (it.number != null ? fmtDay(it.date) + '/' + it.number : it.desc); }

  /* ---------- розбір тексту прийому ---------- */
  // ярлик посилки: «4.11.2026/1» або «4.11/1» — дата пакування / номер
  const PACK = /(\d{1,2})\.(\d{1,2})(?:\.(\d{4}|\d{2}))?\s*\/\s*(\d{1,5})/;
  const DATE_ONLY = /^(\d{1,2})[.\/](\d{1,2})(?:[.\/](\d{4}|\d{2}))?\s*р?\.?$/;
  // заголовок документа: «5.11 РЗ -> Федекс»
  const HEAD = /^(\d{1,2})[.\/](\d{1,2})(?:[.\/](\d{4}|\d{2}))?\s+(\D.*)$/;
  // «3 - дрони», «3. дрони», «3) дрони», «3 дрони», «1-3 - вода» (діапазон з однаковим описом)
  const PARCEL = /^(\d{1,5})(?:\s*[-–—]\s*(\d{1,5})(?=\s*[-–—.):]\s|\s*$))?(?:\s*[-–—.):]\s*|\s+|$)(.*)$/;

  function parseNumList(t) {
    const nums = [];
    for (const tok of t.replace(/\s*[-–—]\s*/g, '-').split(/[,;\s]+/).filter(Boolean)) {
      const m = tok.match(/^(\d+)(?:-(\d+))?$/);
      if (!m) return null;
      const a = +m[1], b = m[2] ? +m[2] : a;
      if (b < a || b - a > 500) return null;
      for (let k = a; k <= b; k++) nums.push(k);
    }
    return nums;
  }
  /** День і місяць без року → найближча дата відносно ref (28.12 у січні — це минулий рік) */
  function mkDate(d, mo, y, ref) {
    if (!(d >= 1 && d <= 31 && mo >= 1 && mo <= 12)) return null;
    if (y != null && y !== '') { y = +y; if (y < 100) y += 2000; return y + '-' + z2(mo) + '-' + z2(d); }
    const r = ref || todayStr(), ry = +r.slice(0, 4);
    const iso = ry + '-' + z2(mo) + '-' + z2(d);
    return iso > r && (mo - +r.slice(5, 7) + 12) % 12 > 1 ? (ry - 1) + iso.slice(4) : iso;
  }
  function packId(r) { return r.number == null ? '' : fmtDay(r.date) + '/' + r.number; }

  /**
   * Текст прийому → {header:{date,title}|null, blocks:[{name, rows:[{line, number, date, desc}]}]}.
   * Рядок-посилка: «Манчестер 4.11/1 вода» або під групою «4.11/1 - вода» чи «1 - вода».
   * Перший рядок «5.11 РЗ -> Федекс» — заголовок. Рядок лише з датою змінює дату для посилок без неї.
   */
  function parseArrival(text, defDate, st) {
    const lines = String(text || '').replace(/\r/g, '').split('\n');
    const ref = defDate || todayStr();
    const blocks = [], warnings = [], bmap = new Map();
    let header = null, date = ref, cur = null, first = true, prevBlank = true;
    const block = name => {
      const k = norm(name);
      if (!bmap.has(k)) { const b = { name: cap(name), rows: [] }; bmap.set(k, b); blocks.push(b); }
      return bmap.get(k);
    };
    const push = (i, number, desc, d) => {
      if (!cur) { warnings.push('Рядок ' + (i + 1) + ': посилка без позиції — пропущено'); return; }
      d = d || date;
      // повтор номера не викидаємо: на ярликах буває однаковий номер з різних днів пакування
      if (number != null && cur.rows.some(r => r.number === number && r.date === d)) warnings.push(cur.name + ' №' + number + ' записано двічі (рядок ' + (i + 1) + ') — перевірте ярлики');
      desc = clean(desc).replace(/^[-–—:,.\s]+/, '');
      cur.rows.push({ line: i, number, date: d, desc, problem: /фото/i.test(desc) });
    };
    lines.forEach((raw, i) => {
      const t0 = clean(raw);
      if (!t0) { prevBlank = true; return; }
      const blank = prevBlank; prevBlank = false;
      // «*Пегас*» — жирна назва позиції з месенджера
      const bold = t0.match(/^[*_]+\s*([^*_]+?)\s*[*_]+:?$/);
      if (bold && !/^\d/.test(bold[1])) { first = false; cur = block(bold[1]); return; }
      const t = t0.replace(/^[•*·▪◦]\s*/, '').replace(/^[-–—]\s+/, '').replace(/^№\s*/, '');
      const isFirst = first; first = false;
      let m = t.match(DATE_ONLY);
      if (m) {
        const d = mkDate(+m[1], +m[2], m[3], ref);
        if (d) { if (isFirst) header = { date: d, title: '' }; date = d; cur = null; return; }
      }
      if (isFirst && !PACK.test(t) && (m = t.match(HEAD))) {
        const d = mkDate(+m[1], +m[2], m[3], ref);
        if (d) { header = { date: d, title: clean(m[4]) }; date = d; return; }
      }
      if ((m = t.match(PACK))) {
        const before = clean(t.slice(0, m.index).replace(/[-–—:,]+\s*$/, ''));
        if (/\p{L}/u.test(before)) cur = block(before);
        const d = mkDate(+m[1], +m[2], m[3], ref);
        if (!d) { warnings.push('Рядок ' + (i + 1) + ': незрозуміла дата «' + m[0] + '»'); return; }
        push(i, +m[4], t.slice(m.index + m[0].length), d);
        return;
      }
      if (/^[\d\s,;–—-]+$/.test(t) && /\d/.test(t)) {
        const nums = parseNumList(t);
        if (nums) { nums.forEach(n => push(i, n, '')); return; }
      }
      m = t.match(PARCEL);
      if (m && /\d/.test(t[0])) {
        const a = +m[1], b = m[2] != null ? +m[2] : a;
        if (b >= a && b - a <= 500) { for (let n = a; n <= b; n++) push(i, n, m[3]); return; }
      }
      // «Манчестер: 1 - вода» в одному рядку
      m = t.match(/^([^:\d][^:]*):\s*(\d.*)$/);
      if (m) {
        cur = block(m[1]);
        const p = m[2].match(PARCEL);
        if (p) { const a = +p[1], b = p[2] != null ? +p[2] : a; for (let n = a; n <= b && n - a <= 500; n++) push(i, n, p[3]); }
        return;
      }
      // рядок без номера: нова позиція (після порожнього рядка, з двокрапкою або відома назва) чи товар без номера («Бк - 4 цинка»)
      const isGroup = !cur || blank || /:\s*$/.test(t) || (st && findGroup(st, t.replace(/[:\-–—]+\s*$/, '')));
      if (isGroup) cur = block(t.replace(/[:\-–—]+\s*$/, ''));
      else push(i, null, t);
    });
    for (const b of blocks) if (!b.rows.length) warnings.push('Позиція «' + b.name + '» без посилок');
    return { header, blocks: blocks.filter(b => b.rows.length), warnings, total: blocks.reduce((a, b) => a + b.rows.length, 0) };
  }
  /** Позначає рядки, які вже записані раніше (та сама позиція, дата пакування, номер) */
  function planArrival(s, parsed) {
    let dup = 0, fresh = 0;
    for (const b of parsed.blocks) {
      const g = findGroup(s, b.name);
      for (const r of b.rows) {
        const ex = g ? findParcel(s, g.id, r.date, r.number) : null;
        r.dup = ex ? ex.state : null;
        if (ex) dup++; else fresh++;
      }
    }
    return { dup, fresh };
  }
  /** Зберігає прийом. o.date / o.title — дата машини й маршрут для заголовка. */
  function applyArrival(s, parsed, o) {
    o = o || {};
    planArrival(s, parsed);
    const ts = new Date().toISOString();
    const ev = { id: uid('in'), kind: 'in', date: o.date || todayStr(), title: clean(o.title), ts, count: 0 };
    for (const b of parsed.blocks) {
      for (const r of b.rows) {
        if (r.dup && !o.allowDup) continue;
        const g = ensureGroup(s, b.name);
        s.items.push({
          id: uid('i'), groupId: g.id, number: r.number, desc: clean(r.desc), date: r.date, state: 'stock',
          problem: !!r.problem, note: '', arrivalId: ev.id, shipmentId: null, createdAt: ts, updatedAt: ts
        });
        ev.count++;
      }
    }
    if (!ev.count) return { ok: false, err: 'Усі посилки вже записані раніше' };
    s.events.push(ev);
    return { ok: true, event: ev };
  }

  /* ---------- тексти для начальника ---------- */
  /** «18 - паливо»; дата пакування додається, лише якщо відрізняється від дати підвозу: «3.11/12 - дрони» */
  function parcelLine(r, headDate) {
    const id = r.number == null ? '' : (headDate && r.date !== headDate ? packId(r) : String(r.number));
    return [id, r.desc].filter(Boolean).join(' - ') + (r.problem ? ' ⚠' : '');
  }
  function arrivalHead(date, title) { const p = String(date || '').split('-'); return [date ? p[2] + '.' + p[1] : '', clean(title)].filter(Boolean).join(' '); }
  /** «04.11 РЗ -> Федекс» + «*Пегас*\n1 - стяжки\n2 - батки…» — як пишуть у месенджері, номери по порядку */
  function formatArrival(head, blocks, headDate) {
    const parts = head ? [head] : [];
    for (const b of blocks) if (b.rows.length) parts.push('*' + b.name + '*\n' + b.rows.slice().sort(cmpItem).map(r => parcelLine(r, headDate)).join('\n'));
    return parts.join('\n\n');
  }
  function arrivalBlocks(ix, items) {
    const by = new Map();
    for (const it of items.slice().sort((a, b) => (a.createdAt || '').localeCompare(b.createdAt || ''))) {
      if (!by.has(it.groupId)) by.set(it.groupId, { name: groupName(ix, it.groupId), rows: [] });
      by.get(it.groupId).rows.push(it);
    }
    return [...by.values()];
  }
  function arrivalText(s, evId) {
    const ix = index(s), ev = ix.events.get(evId);
    return formatArrival(ev ? arrivalHead(ev.date, ev.title) : '', arrivalBlocks(ix, s.items.filter(it => it.arrivalId === evId)), ev && ev.date);
  }
  /** Посилки, що їдуть → «Група:\n3.11 - 1, 3, 4, 6» */
  function shipText(s, items) {
    const ix = index(s), by = new Map();
    for (const it of items) {
      if (!by.has(it.groupId)) by.set(it.groupId, []);
      by.get(it.groupId).push(it);
    }
    const gids = groupOrder(s, [...by.keys()]);
    return gids.map(gid => {
      const days = new Map();
      for (const it of by.get(gid).sort(cmpItem)) {
        if (!days.has(it.date)) days.set(it.date, []);
        days.get(it.date).push(it.number != null ? String(it.number) : it.desc);
      }
      return groupName(ix, gid) + ':\n' + [...days.entries()].map(([d, a]) => fmtDay(d) + ' - ' + a.join(', ')).join('\n');
    }).join('\n\n');
  }

  /* ---------- відвантаження ---------- */
  function ship(s, ids, date) {
    const ts = new Date().toISOString();
    const ev = { id: uid('out'), kind: 'out', date: date || todayStr(), ts, count: 0 };
    for (const id of ids) {
      const it = s.items.find(x => x.id === id);
      if (!it || it.state !== 'stock') continue;
      it.state = 'departed'; it.shipmentId = ev.id; it.updatedAt = ts;
      ev.count++;
    }
    if (!ev.count) return { ok: false, err: 'Немає посилок для відвантаження' };
    s.events.push(ev);
    return { ok: true, event: ev };
  }
  function cancelShipment(s, ev) {
    const ts = new Date().toISOString();
    for (const it of s.items) if (it.shipmentId === ev.id) { it.state = 'stock'; it.shipmentId = null; it.updatedAt = ts; }
    s.events = s.events.filter(e => e.id !== ev.id);
    return { ok: true };
  }
  function deleteArrival(s, ev) {
    if (s.items.some(it => it.arrivalId === ev.id && it.state === 'departed')) return { ok: false, err: 'Частина посилок уже поїхала — спершу скасуйте ту загрузку' };
    s.items = s.items.filter(it => it.arrivalId !== ev.id);
    s.events = s.events.filter(e => e.id !== ev.id);
    return { ok: true };
  }

  /* ---------- редагування ---------- */
  function editItem(s, it, f) {
    const groupId = f.groupId || it.groupId, date = f.date || it.date;
    const number = 'number' in f ? f.number : it.number;
    if (number != null && !(Number.isInteger(number) && number >= 0)) return { ok: false, err: 'Номер має бути цілим числом' };
    if (number == null && !clean(f.desc != null ? f.desc : it.desc)) return { ok: false, err: 'Вкажіть номер або опис' };
    Object.assign(it, { groupId, date, number });
    if (f.desc != null) it.desc = clean(f.desc);
    if (f.note != null) it.note = clean(f.note);
    if ('problem' in f) it.problem = !!f.problem;
    it.updatedAt = new Date().toISOString();
    return { ok: true };
  }
  function deleteItem(s, it) {
    s.items = s.items.filter(x => x.id !== it.id);
    for (const ev of s.events) {
      if (ev.id === it.arrivalId || ev.id === it.shipmentId) ev.count = Math.max(0, ev.count - 1);
    }
    s.events = s.events.filter(e => e.count > 0);
    return { ok: true };
  }
  function renameGroup(s, g, name) {
    name = clean(name);
    if (!name) return { ok: false, err: 'Назва не може бути порожньою' };
    const other = findGroup(s, name);
    if (other && other.id !== g.id) return { ok: false, err: 'Група «' + name + '» уже існує' };
    g.name = name;
    return { ok: true };
  }
  function deleteGroup(s, g) {
    if (s.items.some(i => i.groupId === g.id)) return { ok: false, err: 'У групі є посилки' };
    s.groups = s.groups.filter(x => x.id !== g.id);
    return { ok: true };
  }

  /* ---------- пошук ---------- */
  function tokens(q) { return norm(q).replace(/[№#]/g, ' ').split(/[\s,;]+/).filter(Boolean); }
  function matchItem(ix, it, toks) {
    if (!toks.length) return true;
    const g = norm(groupName(ix, it.groupId)), d = norm(it.desc + ' ' + it.note);
    return toks.every(t => {
      if (/^\d+$/.test(t)) return (it.number != null && String(it.number) === t) || d.includes(t);
      const dm = t.match(/^(\d{1,2})\.(\d{1,2})\.?$/);
      if (dm) return +it.date.slice(8, 10) === +dm[1] && +it.date.slice(5, 7) === +dm[2];
      return g.includes(t) || d.includes(t);
    });
  }

  /* ---------- резервні копії ---------- */
  function exportData(s) {
    return { app: 'miy-sklad', version: 2, exportedAt: new Date().toISOString(),
      groups: s.groups, items: s.items, events: s.events, settings: s.settings, legacy: s.legacy };
  }
  function validateImport(o) {
    const errors = [], warnings = [];
    if (!o || typeof o !== 'object' || Array.isArray(o)) return { ok: false, errors: ['Файл не є резервною копією «Мого складу»'], warnings };
    if (o.app && o.app !== 'miy-sklad') warnings.push('Файл створено іншим застосунком: ' + o.app);
    for (const k of ['groups', 'items']) if (!Array.isArray(o[k])) errors.push('Немає розділу «' + k + '»');
    if (errors.length) return { ok: false, errors, warnings };

  function contentsFor(g) {

    const grp = C.findGroup(S(), g);
    for (const it of S().items) if (it.number != null) add(it.desc, grp && it.groupId === grp.id ? 3 : 1);
    for (const r of D().rows) if (r.number != null) add(r.desc, gk(r.g) === gk(g) ? 3 : 1);
    DEF_CONTENTS.forEach((t, k) => add(t, 0.01 * (DEF_CONTENTS.length - k)));

    };

  A['theme'] = el => { S().settings.theme = el.dataset.k; persist(); applyTheme(); render(); };
  A['import-paste'] = () => {
    sheet('<h3>Вставити текст копії</h3><textarea class="textarea" id="imp-text" placeholder="{&quot;app&quot;:&quot;miy-sklad&quot;, …}"></textarea><div class="row-btns"><button class="btn" data-act="sheet-close">Скасувати</button><button class="btn btn-primary" data-act="sheet-ok">Перевірити</button></div>', {
      onOk: () => { const t = $('#imp-text').value; setTimeout(() => importText(t), 0); }
    });
  };
  A['group-edit'] = el => {
    const g = C.index(S()).groups.get(el.dataset.gid); const n = S().items.filter(i => i.groupId === g.id).length;
    sheet('<h3>Група «' + esc(g.name) + '»</h3><label class="field"><span>Назва</span><input class="input" id="ge-name" value="' + esc(g.name) + '"></label><p class="small">' + pcs(n) + ' за весь час. Назва оновиться всюди.</p>' +
      '<div class="row-btns">' + (n ? '' : '<button class="btn btn-danger" data-act="group-del" data-gid="' + g.id + '">Видалити</button>') + '<button class="btn btn-primary" data-act="sheet-ok">Зберегти</button></div>', {
      onOk: () => { const name = $('#ge-name').value; op('Перейменовано групу', st => C.renameGroup(st, st.groups.find(x => x.id === g.id), name)); }
    });
  };
  A['group-del'] = el => { const gid = el.dataset.gid; closeSheet(); op('Видалено групу', st => C.deleteGroup(st, st.groups.find(x => x.id === gid))); };
  A['wipe'] = () => confirmSheet({ title: 'Очистити всі дані?', text: 'Буде видалено ' + pcs(S().items.length) + ' та всю історію на цьому пристрої. Скасувати можна лише одразу після очищення.', ok: 'Очистити все', danger: true,
    onOk: () => {
      App.undo.push({ before: JSON.stringify(S()), label: 'Очищення даних' });
      const theme = S().settings.theme;
      App.state = C.emptyState(); App.state.settings.theme = theme; App.ui.sel.clear(); Store.saveUi();
      persist(); go('stock'); toast('Дані очищено', { undo: true });
    } });

  /* ================= введення ================= */
  function renderPart(sel, html) { const el = $(sel); if (el) el.innerHTML = html; }
  const INPUT = {
    'stock-q': v => { App.ui.q = v; renderPart('#stock-list', stockList()); },
    'in-text': v => {
      const u = App.ui; u.inText = v; Store.saveUi();
      // текст змінився — старий перегляд і позначки ⚠ уже не відповідають рядкам
      if (u.inShow || u.inProb.size) {
        u.inShow = false; u.inProb.clear(); u.inAllowDup = false;
        renderPart('#in-prev', '<button class="btn btn-primary btn-block" data-act="in-check">Перевірити</button>');
        $('#view').classList.remove('has-bar'); document.body.classList.remove('with-bar');
      }
    },
    'in-date': v => { if (v) { App.ui.inDate = v; Store.saveUi(); render(); } },
    'in-title': v => { App.ui.inTitle = v; Store.saveUi(); },
    'd-num': v => { D().num = v; Store.saveUi(); },
    'd-desc': v => { const d = D(); if (d.active) d.desc[gk(d.active)] = v; Store.saveUi(); }
  };

  // довге натискання на посилку відкриває її картку
  const LP = { t: null, fired: false, x: 0, y: 0 };
  function lpStart(e) {
    const el = e.target.closest('.pc'); if (!el) return;
    LP.fired = false; LP.x = e.clientX; LP.y = e.clientY;
    clearTimeout(LP.t);
    LP.t = setTimeout(() => { LP.fired = true; if (navigator.vibrate) navigator.vibrate(12); itemSheet(el.dataset.id); }, 480);
  }
  function lpMove(e) { if (LP.t && (Math.abs(e.clientX - LP.x) > 10 || Math.abs(e.clientY - LP.y) > 10)) { clearTimeout(LP.t); LP.t = null; } }
  function lpEnd() { clearTimeout(LP.t); LP.t = null; }

  function onClick(e) {
    const el = e.target.closest('[data-act]');
    if (!el || el.disabled) return;
    const act = el.dataset.act;
    if (act === 'pc' && LP.fired) { LP.fired = false; e.preventDefault(); return; }
    if (el.tagName === 'INPUT' && (el.type === 'checkbox' || el.type === 'file')) return; // ці обробляються в change
    const f = A[act];
    if (f) { e.preventDefault(); f(el, e); }
  }
  function onChange(e) {
    const el = e.target;
    if (el.dataset.act === 'import-file') {
      const file = el.files && el.files[0]; if (!file) return;
      const rd = new FileReader();
      rd.onload = () => { importText(String(rd.result)); el.value = ''; };
      rd.onerror = () => toast('Не вдалося прочитати файл', { kind: 'err' });
      rd.readAsText(file);
      return;
    }
    if (el.dataset.act === 'photos') {
      for (const f of el.files || []) App.photos.push({ file: f, url: URL.createObjectURL(f) });
      el.value = ''; render();
      return;
    }
    if (el.type === 'checkbox' && el.dataset.act && A[el.dataset.act]) { A[el.dataset.act](el, e); return; }
    if (el.type === 'date' && el.dataset.in && INPUT[el.dataset.in]) INPUT[el.dataset.in](el.value, el);
  }
  function onInput(e) {
    const el = e.target, k = el.dataset && el.dataset.in;
    if (k && INPUT[k] && el.type !== 'date') INPUT[k](el.value, el);
  }

  /* ================= запуск ================= */
  function initSW() {
    if (IS_ARTIFACT || !('serviceWorker' in navigator)) return;
    if (location.protocol !== 'https:' && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') return;
    navigator.serviceWorker.register('sw.js').then(reg => {
      const watch = w => { if (!w) return; w.addEventListener('statechange', () => { if (w.state === 'installed' && navigator.serviceWorker.controller) { App.swWaiting = w; if (App.route.name === 'stock') render(); } }); };
      if (reg.waiting && navigator.serviceWorker.controller) { App.swWaiting = reg.waiting; render(); }
      reg.addEventListener('updatefound', () => watch(reg.installing));
      setInterval(() => reg.update().catch(() => { /* */ }), 3600e3);
    }).catch(() => { /* */ });
    let reloading = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => { if (reloading) return; reloading = true; Store.flush().then(() => location.reload()); });
  }
  async function boot() {
    document.addEventListener('click', onClick);
    document.addEventListener('change', onChange);
    document.addEventListener('input', onInput);
    document.addEventListener('pointerdown', lpStart, { passive: true });
    document.addEventListener('pointermove', lpMove, { passive: true });
    document.addEventListener('pointerup', lpEnd, { passive: true });
    document.addEventListener('pointercancel', lpEnd, { passive: true });
    document.addEventListener('mousedown', e => { if (e.target.closest('.gsec.open [data-act]') && document.activeElement && document.activeElement.id && /^d-/.test(document.activeElement.id)) e.preventDefault(); });
    document.addEventListener('contextmenu', e => { if (e.target.closest('.pc')) e.preventDefault(); });
    document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.matches('input[type="search"]')) e.target.blur();
      if (e.key === 'Enter' && (e.target.id === 'd-num' || e.target.id === 'd-desc')) { e.preventDefault(); dAdd(); } if (e.key === 'Escape') closeSheet(); });
    document.addEventListener('focusin', e => { if (e.target.matches('input:not([type=checkbox]):not([type=file]), textarea, select')) document.body.classList.add('kb'); });
    document.addEventListener('focusout', () => setTimeout(() => { const a = document.activeElement; if (!a || !a.matches('input, textarea, select')) document.body.classList.remove('kb'); }, 80));
    window.addEventListener('scroll', () => { const t = $('#topbar'); if (t) t.classList.toggle('scrolled', window.scrollY > 4); }, { passive: true });
    const flush = () => { if (Store.t) Store.flush(); };
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flush(); });
    window.addEventListener('pagehide', flush);
    if (window.matchMedia) { try { matchMedia('(prefers-color-scheme: light)').addEventListener('change', applyTheme); } catch (e) { /* */ } }

    await Store.init();
    let loaded = null;
    try { loaded = await Store.load(); } catch (e) { /* */ }
    if (loaded) {
      const wasV1 = loaded.version !== 2;
      App.state = C.migrate(loaded);
      if (wasV1 && (loaded.items || []).length) persist();
    }
    try {
      const ui = await Store.loadUi();
      if (ui && ui.v === 2) {
        Object.assign(App.ui, { inText: ui.inText || '', inDate: ui.inDate || today(), inTitle: ui.inTitle || '', inMode: ui.inMode === 'text' ? 'text' : 'cards', sel: new Set(ui.sel || []) });
        if (ui.dd && Array.isArray(ui.dd.rows)) App.dd = Object.assign({ groups: [], rows: [], active: null, num: '', desc: {}, prob: false, last: null }, ui.dd);
      }
    } catch (e) { /* */ }
    if (navigator.storage && navigator.storage.persisted) navigator.storage.persisted().then(v => { App.persisted = v; }).catch(() => { /* */ });
    applyTheme();
    render();
    initSW();
  }
  window.__MS = { App, Store, C, render, go };
  boot();
})();
</script>
</body>
</html>
